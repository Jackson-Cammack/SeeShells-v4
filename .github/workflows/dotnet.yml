name: .NET CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # WPF (net7.0-windows) can only be built and tested on Windows.
    runs-on: windows-latest

    defaults:
      run:
        working-directory: SeeShellsV3

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Restore dependencies
        run: dotnet restore SeeShellsV3.sln

      - name: Build
        run: dotnet build SeeShellsV3.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SeeShellsV3.sln --configuration Release --no-build --verbosity normal
