name: .NET CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: SeeShellsV3

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 7.0.x

      - name: Restore dependencies
        run: dotnet restore SeeShellsV3.sln

      - name: Build
        run: dotnet build SeeShellsV3.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SeeShellsV3Tests/SeeShellsV3Tests.csproj --configuration Release --no-build --no-restore --verbosity normal