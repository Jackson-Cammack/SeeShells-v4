name: .NET

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SOLUTION: SeeShellsV3/SeeShellsV3.sln

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v2
    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        # Matches the projects' existing target (net7.0-windows); not a framework upgrade.
        dotnet-version: 7.0.x
    - name: Clean
      run: dotnet clean ${{ env.SOLUTION }} && dotnet nuget locals all --clear
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION }}
    - name: Build
      run: dotnet build ${{ env.SOLUTION }} --no-restore
    - name: Test
      run: dotnet test ${{ env.SOLUTION }} --no-build --verbosity normal
